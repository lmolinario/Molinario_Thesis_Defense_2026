name: Apply approved defense speaker notes

on:
  push:
    branches: [main]
    paths:
      - 'defense_speaker_notes_12min.json'
      - 'scripts/apply_defense_speaker_notes.py'
      - '.github/workflows/update-defense-speaker-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with Git LFS files
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PowerPoint library
        run: python -m pip install python-pptx==1.0.2

      - name: Update notes and verify deck integrity
        run: |
          git lfs install --local
          git lfs checkout
          python scripts/apply_defense_speaker_notes.py

      - name: Commit and push modified PowerPoint via Git LFS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Molinario_Thesis_Defense_2026.pptx
          if git diff --cached --quiet; then
            echo "Presentation already has these notes."
          else
            git commit -m "docs: apply concise approved speaker notes to PowerPoint"
            git push origin HEAD:main
          fi
